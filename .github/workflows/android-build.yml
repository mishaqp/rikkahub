name: Android APK Build

on:
  push:
    branches:
      - feature/full-agent-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode and verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          {
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          value = os.environ.get("KEYSTORE_BASE64", "").strip()
          if not value:
              raise SystemExit("KEYSTORE_BASE64 is empty or unavailable")

          value = value.strip("'\"")
          if ";base64," in value:
              value = value.split(";base64,", 1)[1]
          if value.startswith("KEYSTORE_BASE64="):
              value = value.split("=", 1)[1]
          value = re.sub(r"\\s+", "", value)
          value += "=" * (-len(value) % 4)

          try:
              decoded = base64.b64decode(value, altchars=b"-_", validate=True)
          except Exception as exc:
              raise SystemExit(f"KEYSTORE_BASE64 is not valid Base64: {exc}") from exc

          if len(decoded) < 128:
              raise SystemExit("Decoded keystore is unexpectedly small; replace KEYSTORE_BASE64")

          output = Path(os.environ["GITHUB_WORKSPACE"]) / "rikkahub-release.jks"
          output.write_bytes(decoded)
          magic = decoded[:8].hex()
          container = (
              "JKS" if decoded.startswith(bytes.fromhex("feedfeed"))
              else "PKCS12/DER" if decoded.startswith(b"0")
              else "unknown"
          )
          print(f"Decoded keystore: {len(decoded)} bytes; container={container}; magic={magic}")
          PY
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/rikkahub-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"
          } 2>&1 | tee keystore-diagnostic.txt

      - name: Upload keystore diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keystore-diagnostic
          path: keystore-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Build signed release APK
        env:
          STORE_FILE: ${{ github.workspace }}/rikkahub-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APKs and generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$apksigner"
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            unzip -t "$apk" >/dev/null
            "$apksigner" verify --verbose --print-certs "$apk"
          done
          sha256sum "${apks[@]}" > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/rikkahub-release.jks"

  release:
    needs: build-debug-apk
    if: github.ref == 'refs/heads/feature/full-agent-port'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: rikkahub-agent-release-apk
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.13-agent-full
          target_commitish: ${{ github.sha }}
          name: RikkaHub 2.4.13 Agent Full
          body: RikkaHub 2.4.13 with full agent features from ExTV
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          overwrite_files: true

      - name: Point release tag at the built commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v2.4.13-agent-full',
              sha: context.sha,
              force: true,
            })
