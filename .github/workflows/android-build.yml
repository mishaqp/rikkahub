name: Android APK Build

on:
  push:
    branches:
      - feature/full-agent-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Generate debug keystore for release signing
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Generate a debug keystore for release signing
          keytool -genkey -v \
            -keystore "$GITHUB_WORKSPACE/rikkahub-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=RikkaHub Agent, OU=Personal, O=RikkaHub Agent, L=Local, ST=Local, C=FR"
          
          # Verify keystore
          keytool -list -keystore "$GITHUB_WORKSPACE/rikkahub-release.jks" -storepass "$STORE_PASSWORD" -storetype JKS

      - name: Build signed release APK
        env:
          STORE_FILE: ${{ github.workspace }}/rikkahub-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/rikkahub-release.jks"

  release:
    needs: build-debug-apk
    if: github.ref == 'refs/heads/feature/full-agent-port'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: rikkahub-agent-release-apk
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.13-agent-full
          target_commitish: ${{ github.sha }}
          name: RikkaHub 2.4.13 Agent Full
          body: RikkaHub 2.4.13 with full agent features from ExTV
          files: release/*.apk
          overwrite_files: true

      - name: Point release tag at the built commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/v2.4.13-agent-full',
              sha: context.sha,
              force: true,
            })
