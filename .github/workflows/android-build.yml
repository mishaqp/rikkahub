name: Android Debug Build

on:
  push:
    branches:
      - feature/full-agent-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"
          # API 37 is currently published through Google's preview channel on the hosted
          # runner; stable-channel lookup reports it as missing.
          sdkmanager --channel=3 --install "platforms;android-37"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
