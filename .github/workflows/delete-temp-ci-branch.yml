name: Delete temporary CI branch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/delete-temp-ci-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/ci/workflow-overhaul"
