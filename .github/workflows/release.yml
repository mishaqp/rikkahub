name: Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: true

jobs:
  release:
    name: Check, build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$version_name"
          test "$(printf '%s' "$version_name" | wc -l)" -eq 0
          printf 'VERSION_NAME=%s\n' "$version_name" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=v%s\n' "$version_name" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm 10
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android native build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Validate Gradle wrapper and enable cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Check web code
        working-directory: web-ui
        run: |
          pnpm run typecheck
          pnpm exec oxlint app

      - name: Decode and verify release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is missing}"
          : "${STORE_PASSWORD:?KEYSTORE_PASSWORD secret is missing}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is missing}"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/rikkahub-release.jks"
          test "$(wc -c < "$RUNNER_TEMP/rikkahub-release.jks")" -gt 128
          keytool -list \
            -keystore "$RUNNER_TEMP/rikkahub-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Run release tests, lint and build
        env:
          STORE_FILE: ${{ runner.temp }}/rikkahub-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apks=(app/build/outputs/apk/release/*.apk)
          test -x "$apksigner"
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            unzip -t "$apk" >/dev/null
            "$apksigner" verify --verbose --print-certs "$apk"
          done
          sha256sum "${apks[@]}" > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rikkahub-${{ env.VERSION_NAME }}-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/release"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          printf '%s\n\nCommit: `%s`\n' \
            'Персональная подписанная release-сборка RikkaHub Agent Full.' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while read -r asset_id; do
              test -z "$asset_id" || gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].id')
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "RikkaHub $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "RikkaHub $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            "$release_dir"/*.apk \
            "$release_dir/SHA256SUMS.txt"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-failure-diagnostics-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rikkahub-release.jks"
